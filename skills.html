<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#102945" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Outreach" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="images/icon-192.png" />
  <title>Training</title>
  <link rel="stylesheet" href="styles.css?v=20261009-unified-dark" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="app-update.js" defer></script>
  <script src="theme.js?v=20261005-account-theme"></script>
  <link rel="stylesheet" href="sidebar.css?v=batch2" />
  <script src="sidebar.js?v=20261011-performance" defer></script>
</head>
<body class="page-skills">
<div class="app">
  <header class="topbar">
    <div class="topbar-row">
      <h1>Training</h1>
    </div>
    <div class="tabs skills-header-tabs"><a class="active" href="#">Insights</a><a href="#">Practice</a><a href="#">Library</a></div>
  </header>
  <main class="content">
    <section class="card light-card">
      <div class="card-head">
        <h3>Your Call Insights</h3>
        <button class="mini-select" id="skillsRangeSelect" type="button" data-range="7">Last 7 days⌄</button>
      </div>
      <div class="insight-grid" id="skillsInsightGrid">
        <div class="insight"><strong>—</strong><span>Calls Reviewed</span><em>Loading</em></div>
        <div class="insight"><strong>—</strong><span>Avg. Call Length</span><em>Loading</em></div>
        <div class="insight"><strong>—</strong><span>Positive Outcomes</span><em>Loading</em></div>
      </div>
    </section>

    <div class="section-title">Recent Calls</div>
    <section class="card light-card feedback-list" id="skillsRecentCalls">
      <div class="skill-library-loading">
        <span class="skill-library-skeleton"></span>
        <span class="skill-library-skeleton"></span>
        <span class="skill-library-skeleton"></span>
      </div>
    </section>
  </main>

  
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth-guard.js?v=20261018-multiple-actions"></script>
<script src="user-data.js?v=20261001-1918"></script>
<script src="app.js?v=20261002-skills-coaching"></script>
</body>
</html>
