<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102945"><title>Tasks · Steady Hands Outreach</title>
<link rel="stylesheet" href="sidebar.css?v=20261023-tasks-first"><link rel="stylesheet" href="tasks-page.css?v=20261023-lead-picker">
<script src="https://unpkg.com/lucide@latest"></script><script src="sidebar.js?v=20261023-tasks-first" defer></script></head>
<body class="page-tasks"><div class="app">
<header class="topbar"><div class="topbar-row"><div class="tasks-header"><span class="tasks-kicker">STEADY HANDS OUTREACH</span><h1>Tasks</h1><p>Keep every follow-up moving.</p></div><a href="index.html" class="tasks-back">Go to Outreach →</a></div></header>
<main class="content">
<section class="tasks-stats" aria-label="Task summary"><div><span>Open tasks</span><strong id="statOpen">—</strong></div><div><span>Due today</span><strong id="statToday">—</strong></div><div><span>Completed</span><strong id="statDone">—</strong></div></section>
<section class="tasks-board"><div class="tasks-board-head"><div><h2>My Tasks</h2><p>Your callbacks, reminders and next steps</p></div><button class="tasks-primary" id="addTask" type="button"><i data-lucide="plus"></i> New Task</button></div>
<div class="tasks-tabs" role="group" aria-label="Filter tasks"><button class="active" data-filter="all">All</button><button data-filter="today">Today</button><button data-filter="upcoming">Upcoming</button><button data-filter="completed">Done</button></div>
<p id="tasksMessage" class="tasks-message" role="status"></p><div id="tasksList" class="tasks-list"><p>Loading your tasks…</p></div></section></main>
<div id="taskModal" class="tasks-modal" hidden><form id="newTaskForm" class="tasks-dialog"><h2 id="taskModalTitle">New Task</h2><label>Task name<input name="title" required maxlength="160" placeholder="What needs to get done?"></label><label>Details<textarea name="notes" rows="3" placeholder="Optional notes"></textarea></label><div class="tasks-two"><label>Due date<input name="due_at" type="datetime-local"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label></div><div class="tasks-lead-picker"><label for="taskLeadSearch">Link a lead (optional)</label><div class="tasks-lead-controls"><input id="taskLeadSearch" type="search" placeholder="Search business, contact, or phone" autocomplete="off"><select id="taskLeadSort" aria-label="Sort leads"><option value="recent">Recently opened in Outreach</option><option value="called">Called (most recent)</option><option value="notcalled">Not Called</option><option value="voicemail">Voicemail</option><option value="gatekeeper">Gatekeeper</option></select></div><select name="lead_id" id="taskLeadSelect" aria-label="Choose a lead"><option value="">No linked lead</option></select><p id="taskLeadHint" class="tasks-lead-hint">Only leads assigned to you are shown.</p></div><div class="tasks-dialog-actions"><button type="button" id="closeTask">Cancel</button><button class="tasks-primary" type="submit" id="taskSubmit">Create Task</button></div></form></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="auth-guard.js?v=20261023-tasks"></script><script src="user-data.js?v=20261001-1930"></script><script src="tasks-page.js?v=20261023-task-edit-delete" defer></script></body></html>
